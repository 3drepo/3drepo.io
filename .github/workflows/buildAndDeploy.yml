name: Deploy 3drepo.io

on:
  push:
    branches:
      - master
      - staging
    tags:
      - qa_deploy
      - dev_deploy
      # Prod promote tags carry the release version: <env>_deploy-<version>,
      # e.g. uk_deploy-5.26.4. They deploy an already-built, tested image by
      # version (no rebuild) and are gated by a GitHub Environment approval.
      - uk_deploy-*
      - ca_deploy-*
      - uae_deploy-*
  repository_dispatch:
    types:
      - deploy-command

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.client_payload.pull_request.number || github.ref_name }}
  # Never cancel an in-flight prod deploy; branch/qa/dev deploys stay cancellable.
  cancel-in-progress: ${{ !startsWith(github.ref_name, 'uk_deploy') && !startsWith(github.ref_name, 'ca_deploy') && !startsWith(github.ref_name, 'uae_deploy') }}

env:
  DOCKER_BUILDKIT: 1
  IMAGE_REPOSITORY: 3drepo.io
  DOCKERFILE_PATH: docker/3drepo.io/Dockerfile
  # Sourced from the deployed branch so per-branch config applies despite
  # repository_dispatch running this file from the default branch.
  DEPLOY_CONFIG_FILE: .github/deploy/config.env

jobs:
  metadata:
    name: Prepare deployment metadata
    if: (github.event_name == 'push' && github.event.deleted != true) || github.event.client_payload.pull_request != null
    runs-on: ubuntu-24.04
    outputs:
      checkout_repository: ${{ steps.meta.outputs.checkout_repository }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      source_branch: ${{ steps.meta.outputs.source_branch }}
      environment: ${{ steps.meta.outputs.environment }}
      release_name: ${{ steps.meta.outputs.release_name }}
      values_dir: ${{ steps.meta.outputs.values_dir }}
      values_file: ${{ steps.meta.outputs.values_file }}
      promote: ${{ steps.meta.outputs.promote }}
      prod_version: ${{ steps.meta.outputs.prod_version }}
    steps:
      - id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REPOSITORY_NAME: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
          PR_HEAD_REF: ${{ github.event.client_payload.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.client_payload.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.client_payload.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            source_branch="$REF_NAME"
            checkout_repository="$REPOSITORY_NAME"
            checkout_ref="$PUSH_SHA"
            commit_sha="$PUSH_SHA"
          else
            # Registry and cluster secrets are used below, so forks are refused.
            if [[ "$PR_HEAD_REPO" != "$REPOSITORY_NAME" ]]; then
              echo "Refusing to deploy forked PR from '$PR_HEAD_REPO'." >&2
              exit 1
            fi
            source_branch="$PR_HEAD_REF"
            checkout_repository="$PR_HEAD_REPO"
            checkout_ref="$PR_HEAD_SHA"
            commit_sha="$PR_HEAD_SHA"
          fi

          # Defaults (branch push / PR dispatch -> staging; rebuild from source).
          promote=false
          prod_version=""

          if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "tag" ]]; then
            case "$REF_NAME" in
              qa_deploy)
                environment=qa;  release_name=www; values_dir=deployments/asite-qa/helm/3drepo.io;  values_file=values.yaml ;;
              dev_deploy)
                environment=dev; release_name=www; values_dir=deployments/asite-dev/helm/3drepo.io; values_file=values.yaml ;;
              uk_deploy-*|ca_deploy-*|uae_deploy-*)
                # Prod: promote a release-versioned image onto the env's prod values.
                env_prefix="${REF_NAME%%_deploy-*}"
                prod_version="${REF_NAME#*_deploy-}"
                promote=true
                release_name=www
                values_file=values.yaml
                case "$env_prefix" in
                  uk)  environment=uk;  values_dir=deployments/asite-prod/helm/3drepo.io ;;
                  ca)  environment=ca;  values_dir=deployments/asite-ca/helm/3drepo.io ;;
                  uae) environment=uae; values_dir=deployments/asite-uae/helm/3drepo.io ;;
                esac
                if [[ -z "$prod_version" ]]; then
                  echo "Prod deploy tag '$REF_NAME' is missing a version (expected <env>_deploy-<version>, e.g. uk_deploy-5.26.4)." >&2
                  exit 1
                fi ;;
              *)
                echo "Unrecognised deploy tag: $REF_NAME" >&2
                exit 1 ;;
            esac
          else
            environment=staging; release_name=""; values_dir=deployments/asite-stg/helm/3drepo.io; values_file=DefaultStgValues.yaml
          fi

          {
            echo "checkout_repository=$checkout_repository"
            echo "checkout_ref=$checkout_ref"
            echo "commit_sha=$commit_sha"
            echo "source_branch=$source_branch"
            echo "environment=$environment"
            echo "release_name=$release_name"
            echo "values_dir=$values_dir"
            echo "values_file=$values_file"
            echo "promote=$promote"
            echo "prod_version=$prod_version"
          } >> "$GITHUB_OUTPUT"

  deriveReleaseName:
    needs: metadata
    uses: ./.github/workflows/_deriveReleaseName.yml
    with:
      branch: ${{ needs.metadata.outputs.source_branch }}

  deploy:
    name: Build and deploy instance
    if: github.event_name == 'push' || github.event.action == 'deploy-command'
    needs: [metadata, deriveReleaseName]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.metadata.outputs.checkout_repository }}
          ref: ${{ needs.metadata.outputs.checkout_ref }}
          token: ${{ secrets.PROJ_MANAGEMENT_TOKEN }}

      - name: Load deploy config
        env:
          PROMOTE: ${{ needs.metadata.outputs.promote }}
        run: |
          set -euo pipefail
          if [[ ! -f "$DEPLOY_CONFIG_FILE" ]]; then
            echo "Missing required $DEPLOY_CONFIG_FILE" >&2
            exit 1
          fi
          set -a
          # shellcheck disable=SC1090
          source "$DEPLOY_CONFIG_FILE"
          set +a
          # Prod promotes by the tag's version, so HELM_CHART_VERSION is only
          # required for the build-from-source (non-prod) path.
          if [[ "$PROMOTE" != "true" && -z "${HELM_CHART_VERSION:-}" ]]; then
            echo "HELM_CHART_VERSION is not set in $DEPLOY_CONFIG_FILE" >&2
            exit 1
          fi
          {
            echo "HELM_CHART_VERSION=${HELM_CHART_VERSION:-}"
            echo "CUSTOM_HELM_OVERRIDE=${CUSTOM_HELM_OVERRIDE:-}"
          } >> "$GITHUB_ENV"

      - name: Log in to Azure Container Registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "${{ secrets.REGISTRY_LOGIN_SERVER }}" \
            -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Verify release image exists (prod promote)
        if: needs.metadata.outputs.promote == 'true'
        env:
          PROD_VERSION: ${{ needs.metadata.outputs.prod_version }}
        run: |
          set -euo pipefail
          image="${{ secrets.REGISTRY_LOGIN_SERVER }}/${IMAGE_REPOSITORY}:$PROD_VERSION"
          # Promote never rebuilds, so the tested image must already be on ACR
          # (retagged by the release process). Fail clearly if it is not.
          if ! docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "::error::Release image '$image' not found on the registry. Retag/push the release before deploying." >&2
            exit 1
          fi
          echo "Found release image: $image"

      - name: Build Docker image
        if: needs.metadata.outputs.promote != 'true'
        env:
          BRANCH_TAG: ${{ needs.deriveReleaseName.outputs.release_name }}
          COMMIT_SHA: ${{ needs.metadata.outputs.commit_sha }}
        run: |
          set -euo pipefail
          docker build \
            -t "${{ secrets.REGISTRY_LOGIN_SERVER }}/${IMAGE_REPOSITORY}:$BRANCH_TAG" \
            -t "${{ secrets.REGISTRY_LOGIN_SERVER }}/${IMAGE_REPOSITORY}:$COMMIT_SHA" \
            -f "$DOCKERFILE_PATH" \
            .

      - name: Push Docker image
        if: needs.metadata.outputs.promote != 'true'
        env:
          BRANCH_TAG: ${{ needs.deriveReleaseName.outputs.release_name }}
          COMMIT_SHA: ${{ needs.metadata.outputs.commit_sha }}
        run: |
          set -euo pipefail
          docker push "${{ secrets.REGISTRY_LOGIN_SERVER }}/${IMAGE_REPOSITORY}:$BRANCH_TAG"
          docker push "${{ secrets.REGISTRY_LOGIN_SERVER }}/${IMAGE_REPOSITORY}:$COMMIT_SHA"

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: '4.0.1'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.2'

      - name: Get default Helm values file
        uses: actions/checkout@v4
        with:
          repository: 3drepo/DevOps
          token: ${{ secrets.REPO_INSTALLER_TOKEN }}
          sparse-checkout: |
            ${{ needs.metadata.outputs.values_dir }}
            tools/post-deployment
          sparse-checkout-cone-mode: false
          path: devops

      - name: Login to ACR for Helm
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | helm registry login "${{ secrets.REGISTRY_LOGIN_SERVER }}" \
            -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Set up Keeper Secrets Manager CLI
        run: |
          set -euo pipefail
          # Install pipx if the runner lacks it, then install the pinned KSM CLI.
          if ! command -v pipx >/dev/null 2>&1; then
            python3 -m pip install --user --upgrade pipx
            export PATH="$HOME/.local/bin:$PATH"
          fi
          pipx install --force "keeper-secrets-manager-cli==1.5.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Deploy with Helm
        env:
          ENVIRONMENT: ${{ needs.metadata.outputs.environment }}
          RELEASE_NAME: ${{ needs.metadata.outputs.release_name != '' && needs.metadata.outputs.release_name || needs.deriveReleaseName.outputs.release_name }}
          VALUES_PATH: devops/${{ needs.metadata.outputs.values_dir }}/${{ needs.metadata.outputs.values_file }}
          COMMIT_SHA: ${{ needs.metadata.outputs.commit_sha }}
          PROMOTE: ${{ needs.metadata.outputs.promote }}
          PROD_VERSION: ${{ needs.metadata.outputs.prod_version }}
        run: |
          set -euo pipefail

          # Resolve keeper:// refs to a temp file within this step; the trap wipes both
          # the ini and the resolved-values file on exit (success or failure).
          values_file="$(mktemp)"
          kubeconfig_file="$(mktemp)"
          trap 'rm -f "$values_file" "$kubeconfig_file" "$HOME/.keeper/keeper.ini"' EXIT

          umask 077                                    # ini created 0600, no chmod race
          mkdir -p "$HOME/.keeper"
          printf '%s' "${{ secrets.KSM_KEEPER_INIT_FILE_B64 }}" | base64 -d > "$HOME/.keeper/keeper.ini"
          if [[ ! -s "$HOME/.keeper/keeper.ini" ]]; then   # empty secret -> empty ini; fail clearly
            echo "KSM_KEEPER_INIT_FILE_B64 secret is missing or empty" >&2
            exit 1
          fi

          # Target cluster kubeconfig from KSM (per environment), not a GitHub secret.
          case "$ENVIRONMENT" in
            qa)  kcfg_uid=cB6kUbMbgSovRGpQ10lQ5w ;;  # ci-kubeconfig-qa
            dev) kcfg_uid=C93As_06lV79XkjXeKoMQQ ;;  # ci-kubeconfig-dev
            uk)  kcfg_uid=rzRnzL72fmFNrTKKfVbyvw ;;  # ci-kubeconfig-uk  (Keeper prod folder)
            ca)  kcfg_uid=WbQBfYi6XE8NOLfyOuM4PA ;;  # ci-kubeconfig-ca  (Keeper ca folder)
            uae) kcfg_uid=9YGLNUzBhQHs4KHckr8WXA ;;  # ci-kubeconfig-uae (Keeper uae folder)
            *)   kcfg_uid=d3-r_U6ARnrEJwIZm3P9LQ ;;  # ci-kubeconfig-staging
          esac
          ksm --ini-file "$HOME/.keeper/keeper.ini" secret notation "$kcfg_uid/field/password" | base64 -d > "$kubeconfig_file"
          export KUBECONFIG="$kubeconfig_file"

          # Prod promotes an already-built release image+chart by version; non-prod
          # builds from source and deploys the just-built image by commit sha.
          if [[ "$PROMOTE" == "true" ]]; then
            chart_version="$PROD_VERSION"
            image_tag="$PROD_VERSION"
          else
            chart_version="$HELM_CHART_VERSION"
            image_tag="$COMMIT_SHA"
          fi

          # Temp file (not process substitution) so a ksm failure aborts before helm runs.
          ksm --ini-file "$HOME/.keeper/keeper.ini" interpolate --validate \
            "$VALUES_PATH" > "$values_file"

          helm_set_args=(
            --set "image.tag=$image_tag"
            --set "branchName=$RELEASE_NAME"
          )

          override="${CUSTOM_HELM_OVERRIDE#,}"
          if [[ -n "$override" && "$ENVIRONMENT" == "staging" ]]; then
            helm_set_args+=(--set "$override")
          fi

          helm upgrade --install \
            "$RELEASE_NAME" \
            oci://${{ secrets.REGISTRY_LOGIN_SERVER }}/helm/io \
            --version "$chart_version" \
            --namespace default \
            -f "$values_file" \
            "${helm_set_args[@]}"

          # Post-deploy health check; flags the job if the release is unhealthy.
          # Rollouts always take a bit (spot nodes spin up, image pull), so wait first,
          # then poll quietly, only surface the check output on success or final failure.
          kctx="$(kubectl config current-context)"
          chk="devops/tools/post-deployment/postDeployCheck.py"
          attempts=10
          sleep 90
          for attempt in $(seq 1 $attempts); do
            if out="$(python3 "$chk" --context "$kctx" --release "$RELEASE_NAME" --expect-tag "$image_tag" --release-only --no-color 2>&1)"; then
              echo "$out"
              echo "post-deploy check passed (attempt $attempt/$attempts)"
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "post-deploy check not green yet (attempt $attempt/$attempts); waiting 60s..."
              sleep 60
            fi
          done
          echo "$out"
          echo "::error::post-deploy check failed for $RELEASE_NAME ($ENVIRONMENT)"
          exit 1

      - name: Log out from registries
        if: always()
        run: |
          docker logout "${{ secrets.REGISTRY_LOGIN_SERVER }}" || true
          helm registry logout "${{ secrets.REGISTRY_LOGIN_SERVER }}" || true
